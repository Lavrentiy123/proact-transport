name: Frontend checks

on:
  push:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:unit
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end scenarios on the stub
        run: npm run test:e2e
      - name: Visual snapshots (non-blocking, no committed baseline)
        continue-on-error: true
        run: npm run test:visual
      - name: UI metrics (non-blocking)
        continue-on-error: true
        run: npm run ui-metrics -- --out ui-metrics/report.json
      - name: Upload test reports, snapshots and UI metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui-checks
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/ui-metrics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build container and check static delivery plus REST and WS proxy
        run: |
          docker build -t proact-transport-frontend-smoke .
          docker network create proact-transport-smoke
          docker run -d --name proact-transport-backend-smoke --network proact-transport-smoke --network-alias backend --mount "type=bind,source=$PWD,target=/app,readonly" --workdir /app node:24-alpine node scripts/mock-backend.mjs
          docker run -d --name proact-transport-frontend-smoke --network proact-transport-smoke -p 3000:3000 proact-transport-frontend-smoke
          # docker-proxy accepts the port before nginx listens, so early attempts end with a reset (curl 56), not a refusal.
          curl --retry 30 --retry-all-errors --retry-delay 1 -fsS http://localhost:3000/health
          # The stub backend container may still be starting; wait until nginx can reach it.
          curl --retry 30 --retry-all-errors --retry-delay 1 -fsS -o /dev/null http://localhost:3000/api/v1/vehicles
          curl -fsS http://localhost:3000/ | grep -q '<div id="root"></div>'
          node scripts/proxy-smoke.mjs
      - name: Remove smoke container
        if: always()
        run: |
          docker rm -f proact-transport-frontend-smoke proact-transport-backend-smoke || true
          docker network rm proact-transport-smoke || true
